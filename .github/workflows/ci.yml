name: CI

# 质量门禁：元数据校验、类型、Lint、回归测试、生产构建。
# 所有步骤都可以在本地复现：
#   npm ci && npm run validate && npm run tsc && npm run lint && npm test && npm run build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the MIT-licensed CLI directly: no commercial action/license key or PR write token.
      - name: Install verified Gitleaks CLI and scan history
        run: |
          set -euo pipefail
          tools=$(mktemp -d "${RUNNER_TEMP:?}/toposky-gitleaks.XXXXXX")
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$tools/$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tools/$archive" | sha256sum --check -
          tar -xzf "$tools/$archive" -C "$tools" gitleaks
          "$tools/gitleaks" git . --redact=100 --no-banner

  validate:
    name: Validate & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # 脚本直接 import .ts（Node 原生类型剥离），需 Node >= 22.18
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        run: npm run audit:prod
      - name: Third-party license inventory
        run: npm run notices:check
      - name: Metadata validation
        run: npm run validate
      - name: Type check
        run: npm run tsc
      - name: ESLint
        run: npm run lint
      - name: Unit / regression tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # prebuild 会自动跑一次 validate
      - name: Build
        run: npm run build
